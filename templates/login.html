{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login | Retail Intelligence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #1a1a1a;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
            text-transform: capitalize;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            color: #1a1a1a;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            color: #c33;
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #c33;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #764ba2;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #444;
            margin-bottom: 12px;
        }

        .show-password input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 32px 24px;
            }

            .login-header h2 {
                font-size: 24px;
            }

            button {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="account-type-tabs" role="tablist" aria-label="Account type">
                <button type="button" class="tab active" data-value="customer">Customer</button>
                <button type="button" class="tab" data-value="retailer">Retailer</button>
            </div>
            <h2 style="margin-top:16px">Welcome Back</h2>
            <p>Sign in to your account</p>
        </div>

        <style>
            .account-type-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:8px }
            .account-type-tabs .tab { padding:8px 14px; border-radius:999px; border:1px solid #e6e6e6; background:#fafafa; cursor:pointer }
            .account-type-tabs .tab.active { background: linear-gradient(90deg,#667eea,#764ba2); color:white; border-color:transparent }
        </style>

        {% if form.errors %}
            <div class="error">
                ⚠️ Invalid username or password
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="account_type" id="login-account-type" value="customer">

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>

            <div class="show-password">
                <input type="checkbox" id="show-password" aria-controls="{{ form.password.id_for_label }}">
                <label for="show-password">Show password</label>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <script>
            // account type tabs
            (function(){
                const tabs = document.querySelectorAll('.account-type-tabs .tab');
                const hidden = document.getElementById('login-account-type');
                tabs.forEach(t => t.addEventListener('click', function(){
                    tabs.forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    if (hidden) hidden.value = this.dataset.value || '';
                }));
            })();

            // show password
            (function() {
                const checkbox = document.getElementById('show-password');
                const passwordInput = document.querySelector('form input[type="password"]');
                if (!checkbox || !passwordInput) return;
                checkbox.addEventListener('change', function() {
                    passwordInput.type = this.checked ? 'text' : 'password';
                });
            })();
        </script>

        <div class="login-footer">
            Don't have an account? <a href="{% url 'core:signup' %}">Sign up</a>
        </div>
    </div>
</div>

</body>
</html>
