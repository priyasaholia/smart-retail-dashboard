<!DOCTYPE html>
<html>
<head>
    <title>Notebook</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7fafc;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
        }
        .entry {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
        }
        .type {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            color: #4a5568;
        }
        .amount {
            font-size: 16px;
            margin: 4px 0;
        }
        .desc {
            color: #718096;
        }
        .back {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="back">
            <a href="{% url 'core:dashboard' %}">← Back to Dashboard</a>
        </div>

        <h2>📓 Notebook Entries</h2>

        {% for entry in entries %}
            <div class="entry">
                <div class="type">{{ entry.entry_type }}</div>
                {% if entry.amount %}
                    <div class="amount">₹ {{ entry.amount }}</div>
                {% endif %}
                <div class="desc">{{ entry.description }}</div>
                <div style="font-size:12px;color:#a0aec0;">
                    {{ entry.created_at|date:"M d, Y • g:i A" }}
                </div>
            </div>
        {% empty %}
            <p>No notebook entries yet.</p>
        {% endfor %}
    </div>
</body>
</html>
